name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v3
        with:
          install: true
          install_args: --locked node pnpm godot
          cache: true

      - run: mise x -- pnpm install --frozen-lockfile
      - run: mise run lint
      - run: mise run typecheck
      - run: mise run test
      - name: Check committed build outputs
        run: git diff --exit-code -- dist runtime/runner.gd
