name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v3
        with:
          install: true
          install_args: --locked node pnpm godot
          cache: true

      - name: Set Godot executable
        run: |
          godot_bin="$(command -v godot)"
          test -x "$godot_bin"
          echo "GODOT_BIN=$godot_bin" >> "$GITHUB_ENV"

      - run: mise x -- pnpm install --frozen-lockfile
      - run: mise run lint
      - run: mise run typecheck
      - run: mise run test
      - name: Check committed build outputs
        run: git diff --exit-code -- dist runtime/runner.gd
