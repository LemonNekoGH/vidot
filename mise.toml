min_version = "2026.6.0"

[settings]
activate_aggressive = true
lockfile = true


[plugins]
godot = "https://github.com/LemonNekoGH/vfox-godot.git#dd88823451008524efde019c61e222b8dbbf8f62"

[tools]
godot = "4.7.2-stable"
node = "24.18.0"
pnpm = "11.21.0"

[tasks.setup]
run = "pnpm install --frozen-lockfile"

[tasks.build]
run = "pnpm run build"

[tasks.test]
run = "pnpm run test"

[tasks.lint]
run = "pnpm run lint"

[tasks.typecheck]
run = "pnpm run typecheck"

[tasks.check]
depends = ["lint", "typecheck", "test"]
